server {
    listen 80;
    server_name _;

    # ── Security & Embedding ──────────
    # Strip restrictive headers to allow iframe embedding in Next.js
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Frame-Options "" always;
    
    # Avoid absolute redirects that leak internal ports or IPs
    absolute_redirect off;

    # ── Common proxy settings ──────────
    proxy_set_header Host               $http_host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_http_version 1.1;

    # ── Resolver for dynamic upstream (Docker internal DNS) ──
    resolver 127.0.0.11 valid=30s;
    set $hetty http://hetty:8080;
    set $mitmweb http://mitmweb:8081;

    # ── Hetty — Modern HTTP Repeater / Proxy ──
    # Handle both with and without trailing slash
    location /poc/hetty {
        rewrite ^/poc/hetty$ /poc/hetty/ break;
        proxy_pass $hetty/;
        
        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout          86400;
        proxy_send_timeout          86400;
    }
    
    location /poc/hetty/ {
        proxy_pass $hetty/;
        
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout          86400;
        proxy_send_timeout          86400;
    }

    # ── mitmweb — Classic Interactive MITM Proxy ──
    location /poc/mitmweb {
        rewrite ^/poc/mitmweb$ /poc/mitmweb/ break;
        proxy_pass $mitmweb/;
        
        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout          86400;
        proxy_send_timeout          86400;
    }

    location /poc/mitmweb/ {
        proxy_pass $mitmweb/;
        
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout          86400;
        proxy_send_timeout          86400;
    }

    # ── Health check ──────────
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

